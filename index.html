<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/grid.css" rel="stylesheet" type="text/css">
    <link href="css/main.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <title>Delonix Bluetooth Speaker - FSD DEMO</title>
</head>
    <body>
        <header>
            <div id="hero">
                <section class="grid-con">
                    <h1 class="hidden">Introducing the FSD Delonix Bluetooth Speaker</h1>
                    <div id="intro-text" class="col-span-full m-col-span-8 l-col-span-4">
                        <img src="images/intro-delonix.svg" alt="">
                    </div>
                </section>
            </div>   
            
            <section id="main-header" class="grid-con">
                <div class="logo col-span-1 m-col-span-2"></div>
                <button id="burger-btn" class="burger col-start-4 col-end-5"></button>
                <nav id="main-nav" class="subgrid-con col-span-full m-col-start-3 m-col-end-13">
                    <h2 class="hidden">Main Navigation</h2>
                    <ul id="nav-links" class="col-span-full m-col-start-1 m-col-end-9">
                        <li><a href="#">Home</a></li>
                        <li><a href="#">All Products</a></li>
                        <li><a href="#">Our Brand</a></li>
                        <li><a href="#">Contact Us</a></li>
                    </ul>
                    <ul id="nav-icons" class="col-start-3 col-end-5 m-col-start-10 m-col-end-11">
                        <li><a href="#">
                            <i class="bi bi-cart" aria-hidden="true"></i>
                            <span class="hidden">Cart</span>
                        </a></li>
                        <li><a href="#">
                            <i class="bi bi-person" aria-hidden="true"></i>
                            <span class="hidden">Your Account</span>
                        </a></li>
                        <li><a href="#">
                            <i class="bi bi-globe" aria-hidden="true"></i>
                            <span class="hidden">Language</span>
                        </a></li>
                    </ul>
                </nav>  
                              
            </section>

        </header>


        <template id="annotation-template">
            <div class="HotspotAnnotation">
                <p class="title"></p>
                <p class="desc"></p>
                <img alt="">  
            </div>            
        </template>


        <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
