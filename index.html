<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/grid.css" rel="stylesheet" type="text/css">
    <link href="css/main.css" rel="stylesheet" type="text/css">
    <title>Delonix Bluetooth Speaker - FSD DEMO</title>
</head>
    <body>
        <section class="grid-con center-grid-con">
            <h1 class="col-span-full">Introducing the FSD Delonix Bluetooth Speaker</h1>
            <section class="col-span-full">
                <h2 class="hidden">Preview of the Model</h2>
                <model-viewer src="model/prism.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="images/delonix-poster1.webp" shadow-intensity="0.89" autoplay exposure="1" shadow-softness="1">
                    <button class="Hotspot" slot="hotspot-1" data-surface="21 0 95 96 106 1.930 -3.357 2.427" data-visibility-attribute="visible">

                    </button>

                    <button class="Hotspot" slot="hotspot-2" data-surface="23 0 75 76 89 -0.801 0.735 1.066" data-visibility-attribute="visible">

                    </button>

                    <button class="Hotspot" slot="hotspot-3" data-surface="35 0 5 7 6 0.793 0.324 -0.118" data-visibility-attribute="visible">
 
                    </button>
                    
                    <button class="Hotspot" slot="hotspot-4" data-surface="25 0 4 2 7 -0.588 0.343 1.245" data-visibility-attribute="visible">

                    </button>

                    <div class="progress-bar hide" slot="progress-bar">
                        <div class="update-bar"></div>
                    </div>
                </model-viewer>                
            </section>
        </section>

        <template id="annotation-template">
            <div class="HotspotAnnotation">
                <p class="title"></p>
                <p class="desc"></p>
                <img alt="">  
            </div>            
        </template>


        <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
